- term: "Add to User Group"
  def: "Tıklediğiniz toplu kişileri bir kullanıcı grubuna ekler."
- term: "Send Activation Mail"
  def: "Seçtiğiniz kişiye aktivasyon e-postası gönderir."
- term: "Send Password Reset Mail"
  def: "Sadece aktif olan kullanıcılar için geçerlidir. Şifre sıfırlama e-postası gönderir."
- term: "Force Password Change"
  def: "JumpCloud'un kontrol ettiği bütün uygulamalardan hemen atarak, kullanıcıyı bir sonraki girişinde şifresini değiştirmeye zorlar."
- term: "Unlock User Account"
  def: "Birden fazla yanlış şifre girilmesinden dolayı kilitlenen hesabı açar."
