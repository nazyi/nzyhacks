- term: "Add to User Group"
  def: "Adds the selected people in bulk to a user group."
- term: "Send Activation Mail"
  def: "Sends an activation email to the selected person."
- term: "Send Password Reset Mail"
  def: "Only applies to active users. Sends a password reset email."
- term: "Force Password Change"
  def: "Immediately signs the user out of every application JumpCloud controls and forces them to change their password on their next login."
- term: "Unlock User Account"
  def: "Unlocks an account that got locked out from too many incorrect password attempts."
