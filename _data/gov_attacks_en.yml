- term: "Malware"
  def: "Includes viruses, Trojan horses, and worms. A virus attaches to a file and waits to spread, a Trojan is downloaded disguised as a friend, a worm spreads itself across networks."
- term: "Phishing"
  def: "Aims to capture personal info (passwords, card details) via emails/messages that look trustworthy, usually redirecting to fake sites."
- term: "DoS / DDoS"
  def: "Slows down or crashes a site or network by flooding it with requests. DDoS runs simultaneously from multiple computers."
- term: "Man in the Middle"
  def: "Attacker secretly listens to or alters communication between two parties, e.g. via fake Wi-Fi networks."
- term: "SQL Injection"
  def: "Injects malicious SQL into vulnerable databases to gain unauthorized access or manipulate data."
- term: "Ransomware"
  def: "Encrypts a user's files to block access, then demands a ransom to decrypt them."
- term: "Cryptojacking"
  def: "Installs cryptomining software on a device without permission, misusing its processing power and increasing energy use."
- term: "Zero Day Exploit"
  def: "Exploits vulnerabilities that haven't yet been discovered or patched."
- term: "Fileless Malware"
  def: "Leaves no file on disk, running in memory (RAM) to temporarily bypass the OS and security software."
- term: "Drive-By-Download"
  def: "Malicious software is automatically downloaded when a user visits a site, without them realizing it."
- term: "Rootkit Attacks"
  def: "Let an attacker secretly infiltrate a system and maintain access undetected for a long time."
- term: "Tailgating"
  def: "Following someone into a secure area without authorization."
- term: "Quid Pro Quo"
  def: "The attacker offers something in return to get information or help from the target."
