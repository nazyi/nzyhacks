- term: "Kötü Amaçlı Yazılım (Malware)"
  def: "Virüsler, Truva atları ve solucanlar gibi zararlı yazılımları içerir. Virüs dosyaya tutunup açılmayı bekler, Truva Atı dost görünümlü indirilir, Solucan ağlar üzerinden kendi kendine yayılır."
- term: "Oltalama (Phishing)"
  def: "Güvenilir kaynaklardan geliyormuş gibi görünen e-posta/mesajlarla kişisel bilgileri (şifre, kart bilgisi) ele geçirmeyi amaçlar. Genellikle sahte sitelere yönlendirir."
- term: "DoS / DDoS"
  def: "Bir web sitesine veya ağa aşırı istek göndererek yavaşlatma veya çökertme saldırısı. DDoS, birden fazla bilgisayardan eşzamanlı yapılır."
- term: "Ortadaki Adam (MITM)"
  def: "Saldırgan, iki taraf arasındaki iletişimi gizlice dinler veya değiştirir. Örn. sahte Wi-Fi ağlarıyla veri ele geçirme."
- term: "SQL Enjeksiyonu"
  def: "Güvenlik açığı olan veri tabanlarına zararlı SQL kodu enjekte ederek yetkisiz veri erişimi veya manipülasyonu yapılır."
- term: "Fidye Yazılımı (Ransomware)"
  def: "Kullanıcının dosyalarını şifreleyip erişimi engeller, çözmek için fidye talep eder."
- term: "Kripto Madenciliği (Cryptojacking)"
  def: "Cihaza izinsiz kripto madenciliği yazılımı yüklenir, işlemci gücü kötüye kullanılır; performans düşer, enerji tüketimi artar."
- term: "Sıfırıncı Gün Açığı (Zero Day)"
  def: "Henüz keşfedilmemiş/yamalanmamış açıklardan yararlanan saldırılar."
- term: "Fileless Malware"
  def: "Dosya bırakmayan, hafızada (RAM) çalışarak işletim sistemini ve güvenlik yazılımını geçici atlatan zararlı yazılım türü."
- term: "Drive-By-Download"
  def: "Kullanıcı farkında olmadan bir siteye girdiğinde zararlı yazılımın otomatik indirilmesi."
- term: "Rootkit Atakları"
  def: "Saldırganın sisteme gizlice sızıp erişimi uzun süre fark edilmeden sürdürmesini sağlar."
- term: "Tailgating"
  def: "Güvenli bir alana girerken başka birinin peşinden takip ederek girmek."
- term: "Quid Pro Quo"
  def: "Saldırganın bir fayda/avantaj vaat ederek hedeften bilgi veya yardım almaya çalışması."
